[package]
name = "alice-os-keystore"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
description = "Data-encryption keys held by the operating system's key store (Secure Enclave and Keychain on Apple platforms), behind one KeyVault trait"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
# UniFFI callback interface: a key store implemented in Swift / Kotlin is handed to Rust as a KeyVault
uniffi = ["dep:uniffi"]

[dependencies]
# OS entropy for MemoryVault::generate
getrandom = "0.2"
# key bytes are zeroed on drop
zeroize = "1"
uniffi = { version = "=0.28.3", optional = true }

# reading a secret from a terminal: echo control (prompt module)
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["termios", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_IO"] }

# the prompt tests drive the reader through a pseudo-terminal
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["termios", "pty", "fs"] }

[lints.rust]
# unsafe code is allowed only in src/sys/ (the operating system calls), see scripts/unsafe_scope_check.py
unsafe_code = "deny"
