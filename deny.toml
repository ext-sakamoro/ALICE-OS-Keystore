# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# Shared ALICE-* supply-chain policy. Keep the ignore list in step with
# `.cargo/audit.toml`: updating only one of the two makes `cargo deny` and
# `cargo audit` disagree, and the disagreement shows up as a CI failure in
# whichever job runs second.
# ALICE-SDF v1.7.7 (commit 52d26f9) の deny.toml を base に ALICE-Crypto 用に調整
#
# alice-os-keystore は LicenseRef-Proprietary (publish = false)、自分の crate は下の private の ignore で許可の一覧の外
# sibling path dep はゼロ、alice-stubs action は no-op (stub 生成不要)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # unmaintained / transitive dep 由来の warning (informational only、CVE ではない)
    "RUSTSEC-2024-0436",  # paste 1.0.15 unmaintained (proc-macro transitive)
    "RUSTSEC-2025-0141",  # bincode 2.x unmaintained (postcard 移行コスト高)
    "RUSTSEC-2026-0192",  # ttf-parser unmaintained (egui / font transitive)
    "RUSTSEC-2026-0204",  # unmaintained (ALICE-* で共通の ignore)
    "RUSTSEC-2025-0020",  # PyString::from_object buffer overflow (0.24.1+ で fix)
    "RUSTSEC-2026-0176",  # pyo3 nth/nth_back OOB (0.29 で fix)
    "RUSTSEC-2026-0177",  # pyo3 PyCFunction::new_closure Sync 欠落 (0.29 で fix)
    # 期限付きの保留 (scripts/advisory_holds.toml、scripts/advisory_hold_guard.py が版と依存元と期限を確かめる)
    "RUSTSEC-2026-0370",  # zvariant 5.15.1 unmaintained (zbus 5.19 via secret-service 5.2、Linux)
    "RUSTSEC-2026-0371",  # zbus_names 4.3.5 unmaintained (同上)
    "RUSTSEC-2026-0372",  # zvariant_derive 5.15.1 unmaintained (同上)
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
# publish = false の crate (この crate と tools/uniffi-bindgen) の license は一覧で見ない
private = { ignore = true }
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    # Font-related licenses
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # LLVM ecosystem
    "NCSA",
    # Data license
    "CDLA-Permissive-2.0",
]

# alice-crypto の license の例外 (この crate だけに限る、同じ owner)
[[licenses.exceptions]]
name = "alice-crypto"
allow = ["LicenseRef-Proprietary"]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]


# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dep が wildcard version になるため必須
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# alice-crypto: public sibling, pinned by the full commit in Cargo.toml
allow-git = ["https://github.com/ext-sakamoro/ALICE-Crypto"]

[sources.allow-org]
