name: G3 IR

# ALICE-Law G3, IR half: no negation of a whole fused multiply-add result in the optimised
# LLVM IR of alice-os-keystore (scripts/fneg_fma_ir_check.py, byte-identical to ALICE-LOL's).
# The syntax-tree check (tools/no-outer-fneg-of-fma) runs in ci.yml's float-environment job
# on every push; this workflow builds the release IR, so it runs when a path that can change
# the IR changed, and weekly (a dependency inlined into the crate can change it too)

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/g3-ir.txt)
    branches: [main, 'ci/**']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# a superseded run on a branch is cancelled; on main each commit has a group of its own
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after; schedule and manual runs always run; any error runs
  # (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/g3-ir.txt

  ir:
    name: fneg of fma in the release IR (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # blake3's build script (through alice-crypto) compiles C and assembly for the target,
        # so each target runs on a runner native to it
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the toolchain is rust-toolchain.toml's (the IR text depends on the LLVM version);
      # both targets are installed for the probe tests, which build for each architecture
      - name: Targets for the pinned toolchain
        run: |
          rustc -vV
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target/g3-ir
          key: g3-ir-${{ matrix.target }}
      - name: Probe tests (each probe compiled for both architectures, expected verdicts)
        run: python3 scripts/test_fneg_fma_ir_check.py
      # runs even when the probe tests failed, so both results are reported
      - name: No negated fma result in alice-os-keystore's release IR
        if: ${{ !cancelled() }}
        env:
          CARGO_TARGET_DIR: target/g3-ir
        run: python3 scripts/fneg_fma_ir_check.py --package alice-os-keystore --all-features --target ${{ matrix.target }}

  # red when the changes job said run and a heavy job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, ir]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
