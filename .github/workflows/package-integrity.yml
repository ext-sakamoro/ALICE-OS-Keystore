name: Package integrity

# Runs only when dispatched; not a required check. It is its own workflow, so the Security &
# Hygiene gate covers every job it has. The tests of scripts/alice_local_registry.py run in ci.yml
# (scripts job).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  package-integrity:
    name: Package integrity (publish される .crate が build できるか)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable

      # publish される .crate に必要な file が全部入っているかを見る
      #
      # include_str! / include_bytes! が package 境界を越える、exclude を効かせ過ぎる、
      # 必要 file が漏れる — これらは repo / workspace に file がある限り
      # cargo build も cargo test も clippy も preflight も全部通り、
      # crates.io から取得した利用者だけが compile 不能になる
      # (2026-09-28 ALICE-LOL の lol.gbnf で実例)
      #
      # semver-checks は baseline を build するので結果的に検出するが、
      # (a) 壊れた版を publish した後にしか分からない
      # (b) 未 publish crate は baseline が無く発火しない ので予防にならない
      #
      # alice-crypto は crates.io の公開版でなく、Cargo.toml の git の rev から作る local registry で
      # 解決する (版の整合は repo の中で保つ、他の crate は crates.io) commit 済みの tree を package し、
      # 展開した .crate を単独で build する packaged Cargo.lock の alice-* が全て local registry 由来で
      # checksum が一致することを確かめる (script は ALICE-Auth と同じ物)
      - name: cargo package (local registry の alice-*) と展開した .crate の隔離 build
        run: python3 scripts/alice_local_registry.py
