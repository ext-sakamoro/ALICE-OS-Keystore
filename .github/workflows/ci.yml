name: CI

# dtolnay/rust-toolchain is referenced by channel (@stable / @nightly), not by commit SHA:
# rust-toolchain.toml (1.98.1) selects the compiler cargo uses here, and the fuzz jobs call
# `cargo +nightly` explicitly; pinning the action itself is left to the shared template

# fmt / clippy / test (3 OS) / doc / Apple (iOS libraries, Swift binding, Swift package) /
# scripts. Tests run through scripts/run_tests.sh, which fails a named test binary that
# ran fewer tests than its minimum (a feature mismatch cannot turn a step into a no-op).

on:
  push:
    # `ci/**` runs the same checks on a branch before it is fast-forwarded onto main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the Windows console code (src/sys/windows.rs) is compiled only there
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (default features, all targets)
        run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic
      - name: Clippy (all features, all targets)
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # read_secret: 12 on unix (the 11 pseudo-terminal tests are unix only), 1 on Windows
      # exchange: 6 on Linux (EXDEV across /dev/shm is Linux only), 5 on macOS, 1 on Windows (Unsupported)
      # macos_keychain: 10 on macOS against the runner's login keychain, required there (the file compiles to 0 tests elsewhere)
      # windows_dpapi: 13 on Windows against the runner user's DPAPI, required there (0 tests elsewhere)
      # linux_secret_service: 10 and linux_headless: 1 on Linux against gnome-keyring in a private
      # D-Bus session (scripts/with_keyring.sh), required there (0 tests elsewhere)
      # (chosen in the shell, so that scripts/preflight.sh runs the same command; RUNNER_OS is unset locally)
      - name: Install gnome-keyring (Linux, a real Secret Service for the key store tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring dbus
      - name: Test (default features)
        run: |
          if [ "${RUNNER_OS:-}" = Windows ]; then read_min=1; swap_min=1; os_store=",windows_dpapi=13"; elif [ "$(uname -s)" = Linux ]; then read_min=12; swap_min=6; os_store=",linux_secret_service=10,linux_headless=1"; else read_min=12; swap_min=5; os_store=",macos_keychain=10"; fi
          scripts/with_keyring.sh scripts/run_tests.sh vault_oracle=10,"read_secret=$read_min,exchange=$swap_min$os_store" -- cargo test
      - name: Test (all features)
        run: |
          if [ "${RUNNER_OS:-}" = Windows ]; then read_min=1; swap_min=1; os_store=",windows_dpapi=13"; elif [ "$(uname -s)" = Linux ]; then read_min=12; swap_min=6; os_store=",linux_secret_service=10,linux_headless=1"; else read_min=12; swap_min=5; os_store=",macos_keychain=10"; fi
          scripts/with_keyring.sh scripts/run_tests.sh vault_oracle=10,foreign_oracle=7,"read_secret=$read_min,exchange=$swap_min$os_store" -- cargo test --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps --all-features

  apple:
    name: Apple (iOS libraries, Swift binding, Swift package)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/apple_check.sh

  scripts:
    name: scripts (run_tests.sh, unsafe scope)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/test_run_tests.py
      # unsafe code only in src/sys/, each block with a SAFETY note (the checker's own tests first)
      - run: python3 scripts/test_unsafe_scope_check.py
      - run: python3 scripts/unsafe_scope_check.py
