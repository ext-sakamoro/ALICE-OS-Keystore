name: CI

# dtolnay/rust-toolchain is referenced by channel (@stable / @nightly), not by commit SHA:
# rust-toolchain.toml (1.98.1) selects the compiler cargo uses here, and the fuzz jobs call
# `cargo +nightly` explicitly; pinning the action itself is left to the shared template

# fmt / clippy / test (3 OS) / doc / Apple (iOS libraries, Swift binding, Swift package) /
# scripts. Tests run through scripts/run_tests.sh, which fails a named test binary that
# ran fewer tests than its minimum (a feature mismatch cannot turn a step into a no-op).

on:
  push:
    # `ci/**` runs the same checks on a branch before it is fast-forwarded onto main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (default features, all targets)
        run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic
      - name: Clippy (all features, all targets)
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # read_secret: 5 on unix (the 4 pseudo-terminal tests are unix only), 1 on Windows
      # exchange: 2 on Linux / macOS (atomic swap), 1 on Windows (Unsupported)
      # (chosen in the shell, so that scripts/preflight.sh runs the same command; RUNNER_OS is unset locally)
      - name: Test (default features)
        run: |
          if [ "${RUNNER_OS:-}" = Windows ]; then read_min=1; swap_min=1; else read_min=5; swap_min=2; fi
          scripts/run_tests.sh vault_oracle=10,desktop_gaps=3,read_secret="$read_min",exchange="$swap_min" -- cargo test
      - name: Test (all features)
        run: |
          if [ "${RUNNER_OS:-}" = Windows ]; then read_min=1; swap_min=1; else read_min=5; swap_min=2; fi
          scripts/run_tests.sh vault_oracle=10,desktop_gaps=3,foreign_oracle=5,read_secret="$read_min",exchange="$swap_min" -- cargo test --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps --all-features

  apple:
    name: Apple (iOS libraries, Swift binding, Swift package)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/apple_check.sh

  scripts:
    name: scripts (run_tests.sh, unsafe scope)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/test_run_tests.py
      # unsafe code only in src/sys/, each block with a SAFETY note (the checker's own tests first)
      - run: python3 scripts/test_unsafe_scope_check.py
      - run: python3 scripts/unsafe_scope_check.py
