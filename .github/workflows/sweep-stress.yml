name: Keychain sweep stress

# probe for one branch only (never landed): the macOS Keychain tests 20 times in a row on the
# runner, each run a fresh process as the suite runs in CI; every run must pass all 18
on:
  push:
    branches: ["probe/20261024-keystore-sweep-stress"]

jobs:
  stress:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the test binary
        run: cargo test --all-features --test macos_keychain --no-run
      - name: 20 runs
        run: |
          set -u
          pass=0
          for i in $(seq 1 20); do
            out=$(cargo test --all-features --test macos_keychain 2>&1) || true
            if printf '%s\n' "$out" | grep -q '^test result: ok. 18 passed; 0 failed'; then
              pass=$((pass + 1))
            else
              echo "run $i:"; printf '%s\n' "$out" | grep -E 'panicked|FAILED|test result' | head -10
            fi
          done
          echo "macos_keychain: ${pass}/20 runs passed all 18"
          [ "$pass" -eq 20 ]
