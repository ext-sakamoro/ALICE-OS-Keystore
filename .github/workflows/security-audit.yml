name: Security & Hygiene

# dtolnay/rust-toolchain is referenced by channel (@stable / @nightly), not by commit SHA:
# rust-toolchain.toml (1.98.1) selects the compiler cargo uses here, and the fuzz jobs call
# `cargo +nightly` explicitly; pinning the action itself is left to the shared template

# Shared ALICE-* security layout: audit / deny / unused deps / stub guard /
# package integrity / coverage. semver-checks is absent while the crate is
# unpublished: there is no released version to compare with (it is added with the
# first release).
# ALICE-SDF v1.7.7 (commit 52d26f9) を base に alice-os-keystore 用に調整
#
# 目的:
# - RustSec advisory (CVE) の週次検知 (鍵を扱う crate として最高優先度)
# - dep license 逸脱 (GPL 侵入等) の block
# - 未使用依存の炙り出し
# - 仮実装 (panic!(STUB) / dbg!) の CI gate (todo!/unimplemented! は informational)

on:
  push:
    # `ci/**` runs the same checks on a branch before it is fast-forwarded onto main
    branches: [main, 'ci/**']
  schedule:
    # 毎週月曜 09:00 UTC = 18:00 JST
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/security-audit.txt

  audit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # The RUSTSEC-2026-0374 ignore below stays only while its reason holds: basic-toml is
      # in Cargo.lock (else the ignore is stale) and built by no feature (else it would hide
      # a real dependency; cargo-deny also reports that direction). The guard fails in both
      # cases and when it compared nothing.
      - name: Fetch dependencies (the guard reads the dependency tree offline)
        run: cargo fetch --locked
      - name: Audit ignore guard (tests, then basic-toml)
        run: |
          python3 scripts/test_audit_ignore_guard.py
          python3 scripts/audit_ignore_guard.py basic-toml
      # deny.toml と同期した ignore 一覧
      # RUSTSEC-2026-0374 (basic-toml, unmaintained): in Cargo.lock only. the uniffi 0.28
      # optional `bindgen` dependency (uniffi_bindgen -> askama 0.12 -> basic-toml) is
      # recorded in the lockfile but is not built with any feature of this crate
      # (`cargo tree -i basic-toml --all-features -e all --target all` prints nothing;
      # cargo-deny, which resolves features, does not report it). The generator that
      # does use it is tools/uniffi-bindgen, a separate workspace with its own lock that
      # this job does not audit. Remove this ignore when uniffi drops basic-toml or the
      # crate leaves uniffi 0.28.
      - name: Run cargo audit
        run: |
          cargo audit \
            --deny yanked \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0204 \
            --ignore RUSTSEC-2025-0020 \
            --ignore RUSTSEC-2026-0176 \
            --ignore RUSTSEC-2026-0177 \
            --ignore RUSTSEC-2026-0374

  tools-audit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # the binding generator's own lock (build-time tool, not linked into the library):
    # reported, not gating, since its advisory is the one above
    name: cargo audit (tools/uniffi-bindgen, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit on the tool's lock
        run: cargo audit --file tools/uniffi-bindgen/Cargo.lock --deny yanked

  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # EmbarkStudios/cargo-deny-action@v2 は Docker container 内で稼働し、
      # /github/workspace のみ mount するため sibling path dep が見えず fail する
      # Installed directly: the install action resolves a different version than
# the pinned toolchain expects and fails on a clean runner
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      # the advisory ids ignored for a dated hold (scripts/advisory_holds.toml) stay exact:
      # the held crate version, its direct dependents and the expiry are checked against
      # Cargo.lock, and every held id must be in deny.toml (the guard's own tests first;
      # the weekly schedule catches an expired hold even when nothing changes)
      - name: Advisory hold guard (tests, then the holds)
        run: |
          python3 scripts/test_advisory_hold_guard.py
          python3 scripts/advisory_hold_guard.py

      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable

      # false-positive は Cargo.toml の [package.metadata.cargo-machete] ignored で除外
      - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

  stub-guard:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Stub / mock / dbg guard (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `todo!()` / `unimplemented!()` are the endorsed fail-fast idiom here, so
      # fail-fast idiom として endorse されている → block しない、warn only
      # → block 対象は panic!(STUB) (explicit STUB marker) と dbg!() のみ
      # → comment 行 (^\s*//) は除外して source code のみ検知
      - name: Block panic!(STUB) in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'panic!\([^)]*STUB' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            | grep -v ':[[:space:]]*//' \
            | grep -vE ':[[:space:]]*/\*' \
            || true)
          if [ -n "$hits" ]; then
            echo "❌ Explicit STUB panic detected in src/ (production path):"
            echo "$hits"
            exit 1
          fi
          echo "✓ No panic!(STUB) in src/"

      - name: Detect todo! / unimplemented! (informational, not blocking)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'todo!\(|unimplemented!\(' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            | grep -v ':[[:space:]]*//' \
            | grep -vE ':[[:space:]]*/\*' \
            || true)
          if [ -n "$hits" ]; then
            count=$(echo "$hits" | wc -l | tr -d ' ')
            echo "::warning::${count} todo!()/unimplemented!() marker(s) in src/ (informational: these are the endorsed fail-fast idiom, not stubs):"
            echo "$hits" | head -20
          else
            echo "✓ No todo!/unimplemented! markers in src/"
          fi

      - name: Detect dbg!() residual in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rn 'dbg!(' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "❌ dbg!() macro left in src/:"
            echo "$hits"
            exit 1
          fi
          echo "✓ No dbg!() in src/"

      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found in src/ (informational, not blocking):"
            echo "$hits" | head -50
          else
            echo "✓ No TODO/FIXME/XXX/HACK in src/"
          fi

  package-integrity:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Package integrity (publish される .crate が build できるか)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable

      # publish される .crate に必要な file が全部入っているかを見る
      #
      # include_str! / include_bytes! が package 境界を越える、exclude を効かせ過ぎる、
      # 必要 file が漏れる — これらは repo / workspace に file がある限り
      # cargo build も cargo test も clippy も preflight も全部通り、
      # crates.io から取得した利用者だけが compile 不能になる
      # (2026-09-28 ALICE-LOL の lol.gbnf で実例)
      #
      # semver-checks は baseline を build するので結果的に検出するが、
      # (a) 壊れた版を publish した後にしか分からない
      # (b) 未 publish crate は baseline が無く発火しない ので予防にならない
      #
      # alice-crypto は crates.io の公開版でなく、Cargo.toml の git の rev から作る local registry で
      # 解決する (版の整合は repo の中で保つ、他の crate は crates.io) commit 済みの tree を package し、
      # 展開した .crate を単独で build する packaged Cargo.lock の alice-* が全て local registry 由来で
      # checksum が一致することを確かめる (script は ALICE-Auth と同じ物)
      - name: Tests of scripts/alice_local_registry.py
        run: python3 scripts/test_alice_local_registry.py

      - name: cargo package (local registry の alice-*) と展開した .crate の隔離 build
        run: python3 scripts/alice_local_registry.py

  coverage:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov

      - name: Install gnome-keyring (a real Secret Service for the key store tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring dbus

      # the tests live in tests/, so the run must include them (--lib measured 0 of 117 regions);
      # they run against gnome-keyring in a private D-Bus session as in the test job, and every
      # named binary must pass its count (scripts/run_tests.sh), so a store whose tests fail or
      # do not run fails here too; a summary without TOTAL, or with line coverage under the
      # floor, fails the step; the floor is the measured 89.54% (with the Linux store) less a margin
      - name: Run coverage
        run: |
          set -o pipefail
          if [ "$(uname -s)" = Linux ]; then os_store="exchange=6,linux_secret_service=13,linux_headless=1"; else os_store="exchange=5,macos_keychain=18"; fi
          scripts/with_keyring.sh scripts/run_tests.sh vault_oracle=11,foreign_oracle=7,read_secret=12,"$os_store" -- cargo llvm-cov --all-features --summary-only 2>&1 | tee coverage-summary.txt \
            | awk '{ print } $1 == "TOTAL" { found = 1; if ($10 + 0 < 85) { print "line coverage below the 85% floor: " $0; bad = 1 } } END { if (!found) { print "no TOTAL line"; bad = 1 } exit bad }'

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  gate:
    name: Gate
    if: always()
    needs: [changes, audit, tools-audit, deny, unused-deps, stub-guard, package-integrity, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
