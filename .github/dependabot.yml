version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz", "/tools/uniffi-bindgen"]
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
