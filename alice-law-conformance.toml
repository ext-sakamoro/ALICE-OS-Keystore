note = "the only entropy the crate reads is a new key's, by design (a key must be unpredictable; no Law-bearing result is computed from it). The tests read the clock for a unique store name, the age of items left by killed runs and a test timeout, each under a scoped #[allow] saying so. The crate does not depend on getrandom, so clippy cannot name its entry points (an unreachable path is a warning); adding that dependency must add them to clippy.toml."
