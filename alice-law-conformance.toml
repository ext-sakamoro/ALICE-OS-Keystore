# ALICE-Law conformance manifest for this crate (alice-os-keystore). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / since / note / reference_repo) is the "Manifest" section of
# docs/CONFORMANCE.md in that repository.
#
# Every entry was written from a measurement on this repository at the commit
# this file is added on: the test suites were run (default and release profile),
# clippy was run with the crate's own configuration for each feature set, and
# every mutant named below was applied, run and reverted. The crate stores and
# serves keys: it computes no Law-bearing value and has no floating-point code
# (src/ names neither f32 nor f64), so the gates about a Law-bearing value's bits,
# identifier and history (G4, G6 to G9) are n/a, measured by
# scripts/law_boundary_scan.py; the gates that keep it so (G1, G2, G3, G10, G13,
# G14) are pass.

